<!doctype html>
<html lang="en">
<head>
  <!--family:head-->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a1130'/%3E%3Ccircle cx='50' cy='60' r='24' fill='%23f0c64a'/%3E%3Cpath d='M32 14h14l14 34H46zM68 14H54L40 48h14z' fill='%23b3362b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="family.css" />
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
<main>
  <!--family:header-->

  <section class="fam-panels" aria-label="Playground">
    <div class="fam-panel controls">
      <div class="fam-row"><label class="fam-label" for="emblem">Emblem</label><select class="fam-field" id="emblem" data-testid="emblem"></select></div>
      <div class="fam-row"><span class="fam-label">Style</span>
        <div class="fam-seg" role="group" aria-label="Style" id="style" data-testid="style">
          <button type="button" data-value="metal">Metal</button><button type="button" data-value="line">Line</button><button type="button" data-value="color">Color</button>
        </div></div>
      <div class="fam-row"><span class="fam-label">Look</span>
        <div class="fam-seg" role="group" aria-label="Look" id="theme" data-testid="theme">
          <button type="button" data-value="inherit">Page</button><button type="button" data-value="light">Light</button><button type="button" data-value="dark">Dark</button><button type="button" data-value="auto">Auto</button>
        </div></div>
      <div class="fam-row"><span class="fam-label">Size</span>
        <div class="fam-seg" role="group" aria-label="Size" id="size" data-testid="size">
          <button type="button" data-value="32">32</button><button type="button" data-value="64">64</button><button type="button" data-value="128">128</button><button type="button" data-value="256">256</button>
        </div></div>
      <div class="fam-row"><span class="fam-label">Tint</span>
        <div class="fam-seg" role="group" aria-label="Tint" id="tint" data-testid="tint">
          <button type="button" data-value="">Own</button><button type="button" data-value="#c8102e">Red</button><button type="button" data-value="#1f4e9c">Blue</button><button type="button" data-value="#0b6e4f">Green</button>
        </div></div>
      <div class="fam-row"><label class="fam-label" for="engrave">Engrave</label><input class="fam-field" id="engrave" type="text" maxlength="24" placeholder="MVP 2026" autocomplete="off" aria-label="Text to engrave on a medal, plaque, belt, ring, banner, pennant or the plinth of a cup" data-testid="engrave" /></div>
      <div class="fam-row" id="turn-row"><label class="fam-label" for="yaw">Turn</label><input class="range" type="range" id="yaw" min="-180" max="180" step="5" value="0" aria-label="Turn about the vertical axis, in degrees" data-testid="yaw" /><output id="yaw-out" for="yaw">0°</output></div>
      <div class="fam-row" id="tilt-row"><label class="fam-label" for="pitch">Tilt</label><input class="range" type="range" id="pitch" min="-80" max="80" step="5" value="0" aria-label="Tilt toward the eye, in degrees" data-testid="pitch" /><output id="pitch-out" for="pitch">0°</output></div>
    </div>
    <p class="fam-panel note" id="note"></p>
    <div class="stage" id="stage" data-testid="stage" role="region" aria-label="The emblem"></div>
  </section>

  <section class="more" aria-labelledby="code-h">
    <h2 id="code-h">The call</h2>
    <details id="code-box" open><summary>The call that draws it</summary><pre id="code"><code></code></pre></details>
    <p><a class="fam-button" href="gallery.html">Every emblem in the gallery</a></p>
  </section>

  <div class="credits">
    <p class="fam-fine">The art is drawn for this package or comes from the sources listed in <a href="https://github.com/johnmorrisdotca/dougu-sports/blob/main/NOTICE.md">NOTICE.md</a>, each with its licence.</p>
  </div>
  <!--family:unreviewed-->
  <!--family:footer-->
</main>
<!--family:scripts demo.js-->
</body>
</html>
