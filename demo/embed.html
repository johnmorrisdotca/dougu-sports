<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dougu Sports embed</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #frame { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      #pause { position: fixed; right: 6px; bottom: 6px; min-width: 48px; min-height: 48px; padding: 0 12px; border: 1px solid currentColor; border-radius: 24px; background: Canvas; color: CanvasText; font: 600 13px/1 system-ui, sans-serif; opacity: 0.8; cursor: pointer; }
      #pause:hover, #pause:focus-visible { opacity: 1; }
      #pause:focus-visible { outline: 3px solid #6cd0ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="frame" data-testid="frame"></div>
    <button id="pause" type="button" hidden data-testid="pause">Pause</button>
    <script type="module" src="embed.js"></script>
  </body>
</html>
