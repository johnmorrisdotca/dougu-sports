<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dougu Sports: build an emblem and copy the code</title>
  <meta name="description" content="Choose a group and an emblem, its look, size, theme and tint, see it, and copy the code that puts it in a page: the tag, an iframe, a module, an image address or the SVG." />
  <style>
    :root { color-scheme: light dark; --bg: #f6f4ee; --ink: #10151b; --muted: #434b54; --card: #fff; --line: #b9b3a3; --accent: #1f5fa8; --tab: #10151b; --tab-ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1218; --ink: #f6f3ea; --muted: #bcc3cb; --card: #18212a; --line: #475463; --accent: #7fb2ee; --tab: #f6f3ea; --tab-ink: #0d1218; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 32px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p { margin: 0 0 10px; max-width: 70ch; }
    .lede, .note { color: var(--muted); }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .layout { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } .controls { position: sticky; top: 8px; } }
    .controls { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .row { margin: 0 0 8px; }
    .row b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 3px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { font: inherit; font-size: .88rem; font-weight: 700; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    .chips button[aria-pressed="true"] { border-color: var(--tab); background: var(--tab); color: var(--tab-ink); }
    .chips.emblems { max-height: 15rem; overflow-y: auto; }
    .fields label { display: grid; gap: 2px; font-size: .8rem; color: var(--muted); }
    .fields input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 44px; width: 100%; }
    .stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; justify-items: center; align-items: center; min-height: 260px; overflow: auto; }
    .stage svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← The demo</a></p>
    <h1>Build an emblem, copy the code</h1>
    <p class="lede">Choose what you want and the emblem is drawn here by the package. The code under it puts the same emblem in a page.</p>
    <div class="layout">
      <div class="controls" id="controls" data-testid="controls"></div>
      <div>
        <div class="stage" id="stage" data-testid="stage"></div>
        <kazoku-embed-panel id="embed-panel" data-testid="embed-panel" no-size no-preview docs-href="docs/"></kazoku-embed-panel>
        <p class="note" style="margin-top:12px"><a href="https://github.com/johnmorrisdotca/dougu-sports/blob/main/docs/guides/getting-started.md">Getting started</a> · <a href="https://github.com/johnmorrisdotca/dougu-sports/blob/main/docs/guides/architecture.md">Architecture</a> · <a href="./gallery.html">The gallery</a> · <a href="./compose.html">Compose</a></p>
      </div>
    </div>
  </main>
  <script type="module">
    // The builder: a group, an emblem, a look, a theme, a size and a tint; the emblem is drawn by the package's own build beside this page, and the code under it is what `emblemEmbedCode`
    // writes for the same choices. Nothing is sent or stored.
    import { EMBLEM_GROUPS, emblemEmbedCode, emblemName, renderEmblem } from "./dist/index.js";
    import "./kazoku-ui/embed-panel/define.js";
    import { BUILDER_KINDS, CREDIT, embedCode } from "./embed-code.js";

    const GROUPS = Object.keys(EMBLEM_GROUPS);
    const CHOICES = {
      style: { label: "Look", values: ["metal", "line", "color"], default: "metal" },
      theme: { label: "Theme", values: ["inherit", "light", "dark"], default: "inherit" },
      size: { label: "Size", values: ["64", "128", "200", "256"], default: "128" },
    };
    const state = { group: "trophy", emblem: "trophy:cup", tint: "", turnable: false };
    for (const [key, one] of Object.entries(CHOICES)) state[key] = one.default;
    const query = new URLSearchParams(location.search);
    const asked = query.get("emblem");
    if (asked && GROUPS.includes(asked.split(":")[0]) && EMBLEM_GROUPS[asked.split(":")[0]].includes(asked)) { state.emblem = asked; state.group = asked.split(":")[0]; }
    const $ = (id) => document.getElementById(id);
    const options = () => {
      const out = { style: state.style, size: Number(state.size), theme: state.theme };
      if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(state.tint)) out.tint = state.tint;
      return out;
    };
    function chips(key, values, label, nameOf, extra = "") {
      const row = document.createElement("div");
      row.className = "row";
      const b = document.createElement("b");
      b.textContent = label;
      const box = document.createElement("div");
      box.className = `chips ${extra}`.trim();
      box.dataset.choice = key;
      box.setAttribute("role", "group");
      box.setAttribute("aria-label", label);
      for (const value of values) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.value = value;
        button.textContent = nameOf ? nameOf(value) : value;
        button.addEventListener("click", () => {
          state[key] = value;
          if (key === "group") state.emblem = EMBLEM_GROUPS[value][0];
          build();
        });
        box.append(button);
      }
      row.append(b, box);
      return row;
    }
    function build() {
      const controls = [chips("group", GROUPS, "Group"), chips("emblem", EMBLEM_GROUPS[state.group], "Emblem", (id) => emblemName(id, "en"), "emblems")];
      for (const [key, one] of Object.entries(CHOICES)) controls.push(chips(key, one.values, one.label));
      const tint = document.createElement("div");
      tint.className = "row fields";
      tint.innerHTML = `<label><span>Tint (a hex colour, for the colour look)</span><input data-testid="tint" maxlength="7" placeholder="#0b6e4f" value="${state.tint}" /></label>`;
      tint.querySelector("input").addEventListener("input", (event) => { state.tint = event.target.value; draw(); });
      controls.push(tint);
      $("controls").replaceChildren(...controls);
      draw();
    }
    function draw() {
      const o = options();
      $("stage").innerHTML = renderEmblem(state.emblem, o);
      panel.openHref = emblemEmbedCode(state.emblem, { ...o, site: new URL(".", location.href).href }).address;
      panel.update();
      for (const group of document.querySelectorAll("[data-choice]")) for (const button of group.querySelectorAll("button")) button.setAttribute("aria-pressed", String(button.dataset.value === state[group.dataset.choice]));
      document.body.dataset.ready = "true";
    }
    const panel = $("embed-panel");
    panel.kinds = BUILDER_KINDS;
    panel.labels = { html: "Script and tag", element: "Tag" };
    panel.generate = ({ kind }) => embedCode(kind, state.emblem, { ...options(), turnable: state.turnable });
    panel.credits = CREDIT;
    build();
  </script>
</body>
</html>
